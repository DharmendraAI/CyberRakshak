# CyberRakshak AI - Alembic Configuration

[alembic]

# Location of migration scripts
script_location = %(here)s

# Add project root to Python path
prepend_sys_path = .

# Database URL
sqlalchemy.url = postgresql+psycopg2://postgres:Admin@localhost:5432/cyberrakshak


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S